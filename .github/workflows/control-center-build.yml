name: Control Center build

on:
  push:
    paths:
      - "control-center/**"
      - ".github/workflows/control-center-build.yml"
  pull_request:
    paths:
      - "control-center/**"
      - ".github/workflows/control-center-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control-center
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: control-center/package.json
      - name: Install dependencies
        run: npm install
      - name: Build production bundle
        run: npm run build
