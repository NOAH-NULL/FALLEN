name: Python tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile source and tests
        run: python -m compileall -q bot tests
      - name: Run focused regression and extension import tests
        run: pytest -q tests/test_rules_panel.py tests/test_rules_panel_stress.py tests/test_greeting_embed.py tests/test_advanced_greeting.py tests/test_shard_lease_resolution.py tests/test_extension_imports.py tests/test_extension_setup.py
