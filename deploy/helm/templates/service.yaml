apiVersion: v1
kind: Service
metadata:
  name: discord-bot-health
spec:
  selector: {app: discord-bot}
  ports:
  - {port: 8080, targetPort: health, name: health}
---
apiVersion: v1
kind: Service
metadata:
  name: discord-bot-metrics
spec:
  selector: {app: discord-bot}
  ports:
  - {port: 9100, targetPort: metrics, name: metrics}
