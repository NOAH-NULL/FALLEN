[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fallen-discord-bot"
version = "0.1.0"
description = "A modular Discord bot for moderation, security, community management, and automation."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
dependencies = [
  "discord.py>=2.6,<3",
  "davey>=0.1.6,<0.2",
  "wavelink>=3.5,<4",
  "SQLAlchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.30,<1",
  "alembic>=1.16,<2",
  "python-dotenv>=1.1,<2",
  "Pillow>=11,<13",
  "aiohttp>=3.12,<4",
  "redis[hiredis]>=6,<7",
  "prometheus-client>=0.23,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "opentelemetry-api>=1.36,<2",
  "opentelemetry-sdk>=1.36,<2",
  "opentelemetry-exporter-otlp-proto-grpc>=1.36,<2",
  "regex>=2024.11.6,<2027",
  "PyNaCl>=1.5,<2",
]

[project.optional-dependencies]
dashboard = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "itsdangerous>=2.2,<3.0",
]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6,<7",
]
performance = [
  "uvloop>=0.21; platform_system != 'Windows'",
]

[tool.setuptools.packages.find]
include = ["bot*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --cov=bot --cov-report=term-missing"

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true

[tool.vercel]
entrypoint = "control_center_api.app.main:app"
